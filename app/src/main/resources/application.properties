spring.application.name=back-end

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/prescriptions}
jwt.secret=${JWT_SECRET:dev-only-change-this-signing-secret-before-deployment-2026}
clinic.bootstrap-admin.username=${CLINIC_ADMIN_USERNAME:}
clinic.bootstrap-admin.password=${CLINIC_ADMIN_PASSWORD:}

spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
