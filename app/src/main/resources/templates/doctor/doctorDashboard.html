<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Dashboard</title>
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/index.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
  <script th:src="@{/js/render.js}" defer></script>
  <script th:src="@{/js/util.js}" defer></script>
  <script th:src="@{/js/components/header.js}" defer></script>
  <script th:src="@{/js/components/footer.js}" defer></script>
</head>

<body th:attr="data-token=${authToken},data-role=${role}" onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header" class="header"></div>
      <main class="main-content doctor-dashboard">
        <h2>Patient Appointments</h2>
        <div class="filter-wrapper">
          <button id="todayButton" class="today-btn" type="button">Today's Appointments</button>
          <input id="datePicker" class="date-picker input-field" type="date" aria-label="Appointment date">
          <input id="searchBar" class="input-field" type="text" placeholder="Search by patient name"
            aria-label="Search patients">
        </div>
        <p id="page-message" role="status"></p>
        <div class="table-wrap">
          <table id="patientTable">
            <thead>
              <tr>
                <th>Patient ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Appointment</th>
                <th>Prescription</th>
              </tr>
            </thead>
            <tbody id="patientTableBody"></tbody>
          </table>
        </div>
      </main>
      <div id="footer"></div>
    </div>
  </div>
  <div id="modal" class="modal" aria-hidden="true">
    <span id="closeModal" class="close" role="button" tabindex="0" aria-label="Close">&times;</span>
    <div id="modal-body"></div>
  </div>
  <script type="module" th:src="@{/js/components/patientRows.js}" defer></script>
  <script type="module" th:src="@{/js/services/patientServices.js}" defer></script>
  <script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>
</body>

</html>
