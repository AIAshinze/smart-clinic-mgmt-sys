<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/index.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">
  <script th:src="@{/js/render.js}" defer></script>
  <script th:src="@{/js/util.js}" defer></script>
  <script th:src="@{/js/components/header.js}" defer></script>
  <script th:src="@{/js/components/footer.js}" defer></script>
</head>

<body th:attr="data-token=${authToken},data-role=${role}" onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header" class="header"></div>
      <main class="main-content admin-dashboard">
        <h2>Manage Doctors</h2>
        <input class="input-field" type="text" id="searchBar" placeholder="search by doctor name">
        <div class="filter-wrapper">
          <select class="select-dropdown" id="filterTime" aria-label="Filter by availability time">
            <option value="">All times</option>
            <option value="AM">Morning</option>
            <option value="PM">Afternoon</option>
          </select>
          <select class="select-dropdown" id="filterSpecialty" aria-label="Filter by specialty">
            <option value="">All specialties</option>
          </select>
        </div>
        <p id="page-message" role="status"></p>
        <div id="content" class="card-grid"></div>
      </main>
      <div id="footer"></div>
    </div>
  </div>
  <div id="modal" class="modal" aria-hidden="true">
    <span id="closeModal" class="close" role="button" tabindex="0" aria-label="Close">&times;</span>
    <div id="modal-body"></div>
  </div>
  <script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
  <script type="module" th:src="@{/js/components/doctorCard.js}" defer></script>
</body>

</html>
