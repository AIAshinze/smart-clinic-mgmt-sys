<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCare | Admin dashboard</title>
  <link rel="stylesheet" th:href="@{/assets/css/clinic.css}">
  <script type="module" th:src="@{/js/adminDashboard.js}"></script>
</head>
<body th:attr="data-token=${authToken},data-role=${role}">
  <div class="page-shell">
    <header id="header" class="site-header">
      <a class="brand" th:href="@{/}">SmartCare</a>
      <nav><a class="button button-outline" th:href="@{/}">Clinic portal</a><button id="logout" class="button button-quiet" type="button">Sign out</button></nav>
    </header>
    <main class="content-section">
      <p class="eyebrow">Administrator</p>
      <h1>Doctor directory</h1>
      <p class="muted">Manage clinic providers and their appointment availability.</p>
      <div class="filters">
        <label>Search doctors<input id="searchBar" type="search" placeholder="Search by name"></label>
        <label>Time<select id="filterTime"><option value="">Any time</option><option value="AM">Morning</option><option value="PM">Afternoon</option></select></label>
        <label>Specialty<select id="filterSpecialty"><option value="">All specialties</option></select></label>
      </div>
      <button id="open-add-doctor" class="button button-primary" type="button">Add doctor</button>
      <p id="page-message" class="status-message" role="status"></p>
      <div id="content" class="card-grid"></div>
    </main>
    <footer id="footer" class="site-footer"><p>SmartCare clinic administration</p></footer>
  </div>
  <dialog id="add-doctor-dialog" class="app-dialog">
    <button id="close-add-doctor" class="dialog-close" type="button" aria-label="Close">&times;</button>
    <form id="add-doctor-form" class="dialog-form">
      <h2>Add a doctor</h2>
      <label>Name<input name="name" required minlength="3" maxlength="100"></label>
      <label>Specialty<input name="specialty" required minlength="3" maxlength="50"></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Phone (10 digits)<input name="phone" inputmode="numeric" pattern="[0-9]{10}" required></label>
      <label>Initial password<input name="password" type="password" minlength="8" required></label>
      <label>Availability (comma-separated HH:mm-HH:mm)<input name="availableTimes" placeholder="09:00-10:00,14:00-15:00"></label>
      <button class="button button-primary" type="submit">Save doctor</button>
    </form>
  </dialog>
</body>
</html>
