<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCare</title>
</head>

<body>
  <main>
    <h1>Appointment management moved</h1>
    <p>Update or cancel your scheduled visits from your appointments page.</p>
    <a href="/pages/patientAppointments.html">Open my appointments</a>
  </main>
  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("userRole");
    const destination = token && role === "loggedPatient"
      ? "/pages/patientAppointments.html"
      : role === "patient" ? "/pages/patientDashboard.html" : "/";
    window.location.replace(destination);
  </script>
</body>

</html>
