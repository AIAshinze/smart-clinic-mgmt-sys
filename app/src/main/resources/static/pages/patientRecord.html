<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCare</title>
</head>

<body>
  <main>
    <h1>Patient records moved</h1>
    <p>Patient records are available to authorized doctors from the SmartCare dashboard.</p>
    <a href="/">Open SmartCare</a>
  </main>
  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("userRole");
    if (token && role === "doctor") {
      window.location.replace(`/doctorDashboard/${encodeURIComponent(token)}`);
    } else {
      window.location.replace("/");
    }
  </script>
</body>

</html>
