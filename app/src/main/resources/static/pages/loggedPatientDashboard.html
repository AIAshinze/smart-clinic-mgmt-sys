<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patient Dashboard</title>
  <link rel="icon" type="image/png" href="../assets/images/logo/logo.png">
  <link rel="stylesheet" href="../assets/css/adminDashboard.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/patientDashboard.css">
  <script src="../js/render.js" defer></script>
  <script src="../js/util.js" defer></script>
  <script src="../js/components/header.js" defer></script>
  <script src="../js/components/footer.js" defer></script>
  <script type="module" src="../js/components/modals.js" defer></script>
</head>

<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header" class="header"></div>
      <main class="main-content">
        <h2>Find a Doctor</h2>
        <input type="text" id="searchBar" class="searchBar input-field" placeholder="Search by doctor name">
        <div class="filter-wrapper">
          <select class="filter-select select-dropdown" id="filterTime" aria-label="Filter by availability">
            <option value="">Any time</option>
            <option value="AM">Morning</option>
            <option value="PM">Afternoon</option>
          </select>
          <select class="filter-select select-dropdown" id="filterSpecialty" aria-label="Filter by specialty">
            <option value="">All specialties</option>
          </select>
        </div>
        <p id="page-message" role="status"></p>
        <div id="content" class="card-grid"></div>
      </main>
      <div id="footer"></div>
    </div>
  </div>
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <span class="close" id="closeModal" role="button" tabindex="0" aria-label="Close">&times;</span>
      <div id="modal-body"></div>
    </div>
  </div>
  <script type="module" src="../js/patientDashboard.js" defer></script>
</body>

</html>
