<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCare Clinic</title>
  <link rel="icon" type="image/png" href="./assets/images/logo/logo.png">
  <link rel="stylesheet" href="./assets/css/index.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <script src="./js/util.js" defer></script>
  <script src="./js/render.js" defer></script>
  <script src="./js/components/header.js" defer></script>
  <script src="./js/components/footer.js" defer></script>
  <script type="module" src="./js/services/index.js" defer></script>
</head>

<body class="home-page">
  <div class="container">
    <div class="wrapper">
      <div id="header" class="header"></div>
      <main class="main-content">
        <h2>Select Your Role</h2>
        <div class="role-options">
          <button id="adminLogin" class="button" type="button">Admin</button>
          <button id="doctorLogin" class="button" type="button">Doctor</button>
          <button id="patientRole" class="button" type="button">Patient</button>
        </div>
      </main>
      <div id="footer"></div>
    </div>
  </div>

  <div id="modal" class="modal" aria-hidden="true">
    <span id="closeModal" class="close" role="button" tabindex="0" aria-label="Close">&times;</span>
    <div id="modal-body"></div>
  </div>
</body>

</html>
