<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6b66">
  <meta name="description" content="SmartCare clinic appointments and care management">
  <title>SmartCare Clinic</title>
  <link rel="icon" type="image/png" href="./assets/images/logo/logo.png">
  <link rel="stylesheet" href="./assets/css/clinic.css">
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <div class="page-shell">
    <header id="header" class="site-header"></header>
    <main>
      <section class="hero">
        <p class="eyebrow">Care, made easier</p>
        <h1>Clinic care that works around you.</h1>
        <p>Find a doctor, book a visit, and keep your care details together in one secure place.</p>
        <button id="hero-sign-in" class="button button-light" type="button">Sign in to your account</button>
      </section>

      <section id="home-view" class="content-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Our care team</p>
            <h2>Find a doctor</h2>
          </div>
          <p>Choose a specialty and a time that suits you.</p>
        </div>
        <div class="filters">
          <label>Doctor name<input id="search-doctor" type="search" placeholder="Search by name"></label>
          <label>Availability
            <select id="filter-time">
              <option value="">Any time</option>
              <option value="AM">Morning</option>
              <option value="PM">Afternoon</option>
            </select>
          </label>
          <label>Specialty<select id="filter-specialty">
              <option value="">All specialties</option>
            </select></label>
        </div>
        <p id="directory-message" class="status-message" role="status"></p>
        <div id="doctor-list" class="card-grid"></div>
      </section>

      <section id="workspace-view" class="content-section workspace" hidden>
        <div id="workspace"></div>
      </section>
    </main>
    <footer id="footer" class="site-footer"></footer>
  </div>

  <dialog id="app-dialog" class="app-dialog" aria-labelledby="dialog-title">
    <button id="dialog-close" class="dialog-close" type="button" aria-label="Close dialog">&times;</button>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>

</html>
